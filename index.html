<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPM - Rulur</title>
    <script src="./js/jquery.3.7.1.min.js"></script>
    <script src="./js/index.js"></script>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/animate.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="title">BPM</h1>
        </div>
        <div class="main-content">
            <div id="tap-area" class="tap-area">
                <div class="bpm-display">
                    <span id="bpm-value" class="bpm-value">---</span>
                    <span class="bpm-label">点击开始</span>
                </div>
            </div>
            <div class="controls">
                <button id="decrease-btn" class="control-btn">-</button>
                <button id="metronome-btn" class="metronome-btn">
                    <span class="metronome-icon">♪</span>
                </button>
                <button id="increase-btn" class="control-btn">+</button>
            </div>
            <div class="bottom-bar">
                <label class="mute-control">
                    <input type="checkbox" id="mute-checkbox">
                    <span class="mute-label">静音</span>
                </label>
                <button id="reset-btn" class="reset-btn">重置</button>
            </div>
        </div>
    </div>
</body>

</html>
